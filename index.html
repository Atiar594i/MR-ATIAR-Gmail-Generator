<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atiar Gmail Generator</title>
  <style>
    /* General Styles */
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      max-width: 1000px;
      width: 100%;
      background: #fff;
      padding: 20px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    label {
      font-size: 1rem;
      color: #444;
    }
    input, button, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      box-sizing: border-box;
      border: 2px solid #ddd;
      border-radius: 5px;
    }
    button {
      background-color: #007bff;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      border: none;
    }
    button:hover {
      background-color: #0056b3;
    }
    textarea {
      height: 200px;
      resize: vertical;
      background: #f8f8f8;
      color: #333;
    }
    .output-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .output-box {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #ddd;
      overflow-y: auto;
      max-height: 250px;
    }
    .flex-container {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .output-box span {
      font-weight: bold;
      color: #007bff;
    }

    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }
      .output-box {
        height: 180px;
      }
    }
    @media (max-width: 480px) {
      .container {
        padding: 10px;
      }
      input, button, textarea {
        font-size: 0.9rem;
        padding: 8px;
      }
    }

    .credit {
      margin-top: 20px;
      text-align: center;
      font-size: 0.9rem;
      color: #555;
    }
    .credit a {
      color: #007bff;
      text-decoration: none;
    }
    .credit a:hover {
      text-decoration: underline;
    }

    /* Popup styles */
    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .popup-content {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    .popup-content h3 {
      margin-bottom: 20px;
      font-size: 1.2rem;
    }
    .popup-content button {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
    }
    .popup-content button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <!-- Join Popup -->
  <div class="popup" id="joinPopup">
    <div class="popup-content">
      <h3>এই টুল ব্যবহারের আগে আমাদের চ্যানেলে জয়েন করুন</h3>
      <a href="https://t.me/FAST_OTP_WORLD_BACKUP" target="_blank">
        <button>Join Now</button>
      </a>
      <br><br>
      <button onclick="closePopup()">I have Joined</button>
    </div>
  </div>

  <div class="container">
    <h2>Atiar Gmail Generator</h2>
<p style="text-align: center; margin-top: -10px;">
  <a href="https://t.me/atiar59" target="_blank">@atiar59</a>
</p>
    <div class="flex-container">
      <div>
        <label for="email">Enter Gmail address:</label>
        <input type="text" id="email" placeholder="example@gmail.com" />
      </div>
      <div>
        <label for="count">How many emails to generate?</label>
        <input type="number" id="count" value="100" min="1" max="100000" />
      </div>
    </div>
    <button onclick="generateEmails()">Gmail Generator</button>

    <div class="output-container">
      <div class="output-box">
        <span>Generated Emails</span>
        <textarea id="output" readonly></textarea>
      </div>
      <div class="output-box">
        <span>Copied Emails</span>
        <textarea id="copied" readonly></textarea>
        <button onclick="copyAllEmails()">Copy All Gmail</button>
      </div>
    </div>
    <button onclick="copyEmail()">Gmail CUT NOW </button>

    <div class="credit">
      <p>Made By: MD Atiar Khan Atik<br>
  <a href="https://t.me/atiar59" target="_blank">@atiar59</a>
</p>
    </div>
  </div>

  <script>
    // Show popup on page load
    window.onload = function () {
      document.getElementById("joinPopup").style.display = "flex";
      document.querySelector(".container").style.display = "none";
    };

    function closePopup() {
      document.getElementById("joinPopup").style.display = "none";
      document.querySelector(".container").style.display = "block";
    }

    let generatedEmails = [];

    async function generateEmails() {
      const input = document.getElementById("email").value.trim().toLowerCase();
      const count = parseInt(document.getElementById("count").value);
      const output = document.getElementById("output");
      output.value = "Generating...";

      if (!input.includes("@") || !input.endsWith("@gmail.com")) {
        output.value = "Please enter a valid Gmail address.";
        return;
      }

      const local = input.split("@")[0];
      const charset = local.split('');
      const results = new Set();

      for (let i = 0; i < count; i++) {
        let variant = '';
        for (let ch of charset) {
          variant += Math.random() > 0.5 ? ch.toUpperCase() : ch;
        }
        results.add(`${variant}@gmail.com`);
      }

      generatedEmails = Array.from(results);
      output.value = generatedEmails.join("\n");
    }

    function copyEmail() {
      const copied = document.getElementById("copied");
      const randomEmail = generatedEmails[Math.floor(Math.random() * generatedEmails.length)];
      navigator.clipboard.writeText(randomEmail).then(() => {
        copied.value += randomEmail + "\n";
      }).catch(err => {
        console.error('Error copying text: ', err);
      });
    }

    function copyAllEmails() {
      navigator.clipboard.writeText(generatedEmails.join("\n")).then(() => {
        alert("All emails have been copied!");
      }).catch(err => {
        console.error('Error copying all emails: ', err);
      });
    }
  </script>
</body>
</html>
